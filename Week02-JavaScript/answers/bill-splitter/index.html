<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bill Splitter</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Restaurant Bill Splitter</h1><p>Add ordered items, select a tip and split equally.</p><section><h2>Add menu items</h2><label>Item name<input id="itemName" placeholder="Fried rice"></label><label>Cost (LKR)<input id="itemCost" type="number" min="0.01" step="0.01"></label><button id="addItem">Add item</button><p id="itemError" class="error"></p><ul id="itemList"></ul><b>Subtotal: LKR <span id="subtotal">0.00</span></b></section><section><h2>Split details</h2><label>Tip rate<select id="tipRate"><option value="0">0%</option><option value=".05">5%</option><option value=".10" selected>10%</option><option value=".15">15%</option><option value=".20">20%</option></select></label><label>Number of people<input id="people" type="number" min="1" step="1" value="2"></label><button id="calculate">Calculate split</button><p id="error" class="error"></p><div id="result" aria-live="polite"></div></section></main><script src="app.js"></script></body></html>
